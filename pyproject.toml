[project]
name = "lisaastrophysicalbackgrounds"
version = "0.1.0"
description = "This package can be used to create an astrophysical gravitational wave background for a specific star formation history and galaxy catalogue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.2.0",
    "h5py>=3.15.1",
    "ipykernel>=7.2.0",
    "jax",
    "lisaconstants",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pytest>=9.0.2",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
cuda12x = [
    "jax[cuda12]",
]
cuda13x = [
    "jax[cuda13]",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lisaastrophysicalbackgrounds/__init__.py"

