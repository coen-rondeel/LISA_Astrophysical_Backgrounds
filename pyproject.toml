# python guidelines as defined for LISA
[tool.ruff]
# Target the minimum supported version in your guidelines
target-version = "py310" 
line-length = 88

[tool.ruff.lint]
# Select rules:
# E/W = PEP 8 errors/warnings
# F = Pyflakes
# I = Import sorting (isort replacement)
# D = Docstring style (pydocstyle replacement for PEP 257)
# UP = Pyupgrade (ensures modern f-strings, type hints, etc.)
select = ["E", "W", "F", "I", "D", "UP"]

# Optional: Adjust docstring convention to match PEP 257 (Google or NumPy styles also available)
[tool.ruff.lint.pydocstyle]
convention = "pep257"